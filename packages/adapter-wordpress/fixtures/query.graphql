# The query that produces the fixtures, recorded by `pnpm record-fixtures`
# (scripts/record-fixtures.mjs) from pages that `pnpm --filter
# cms-wordpress-headless seed` creates.

query PageSections($uri: ID!) {
  page(id: $uri, idType: URI) {
    title
    uri
    ...PageHeroFields
    ...PageBuilderFields
  }
}
