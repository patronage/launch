# The query that produces fixtures/home.json, recorded from the home page that
# `pnpm --filter cms-wordpress-headless seed` creates, with the origin set to
# https://cms.example.com and one unknown layout added to test skipping.

query PageSections($uri: ID!) {
  page(id: $uri, idType: URI) {
    title
    uri
    ...PageBuilderFields
  }
}
