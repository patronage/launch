# The WPGraphQL for ACF query that produces fixtures/home.json.
# Field group "Page Builder" (graphql name pageBuilder), flexible content field
# "sections", defined in apps/cms-wordpress-headless/wp-content/themes/
# patronage-headless/fields/page-builder.php. Every layout has its own
# sectionOptions group, so each type selects it.

fragment Image on AcfMediaItemConnectionEdge {
  node {
    sourceUrl
    altText
    caption
    mediaDetails {
      width
      height
    }
  }
}

fragment Link on AcfLink {
  title
  url
  target
}

query PageSections($uri: ID!) {
  page(id: $uri, idType: URI) {
    title
    uri
    pageBuilder {
      sections {
        __typename
        ... on PageBuilderSectionsContentLayout {
          sectionOptions {
            skin
            width
            paddingTop
            paddingBottom
            anchor
            hidden
          }
          eyebrow
          heading
          body
          align
          links {
            link {
              ...Link
            }
            variant
          }
        }
        ... on PageBuilderSectionsContentMediaLayout {
          sectionOptions {
            skin
            width
            paddingTop
            paddingBottom
            anchor
            hidden
          }
          eyebrow
          heading
          body
          media {
            ...Image
          }
          mediaPosition
          links {
            link {
              ...Link
            }
            variant
          }
        }
        ... on PageBuilderSectionsMediaLayout {
          sectionOptions {
            skin
            width
            paddingTop
            paddingBottom
            anchor
            hidden
          }
          media {
            ...Image
          }
        }
        ... on PageBuilderSectionsCardGridLayout {
          sectionOptions {
            skin
            width
            paddingTop
            paddingBottom
            anchor
            hidden
          }
          heading
          columns
          cards {
            title
            text
            image {
              ...Image
            }
            link {
              ...Link
            }
          }
        }
        ... on PageBuilderSectionsBlockquoteLayout {
          sectionOptions {
            skin
            width
            paddingTop
            paddingBottom
            anchor
            hidden
          }
          quote
          attribution
          role
          image {
            ...Image
          }
        }
        ... on PageBuilderSectionsCallToActionLayout {
          sectionOptions {
            skin
            width
            paddingTop
            paddingBottom
            anchor
            hidden
          }
          heading
          body
          links {
            link {
              ...Link
            }
            variant
          }
        }
      }
    }
  }
}
