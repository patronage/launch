# Local Timber WordPress. Plugins come from `composer install` into
# wp-content/plugins, which is mounted here and never committed.
name: launch-wp-timber

x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DEBUG: 1
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_ENVIRONMENT_TYPE', 'local');
    define('WP_DEBUG_LOG', '/dev/stderr');
    define('WP_DEBUG_DISPLAY', false);

x-wordpress-volumes: &wordpress-volumes
  - wordpress:/var/www/html
  - ./wp-content/plugins:/var/www/html/wp-content/plugins
  - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
  # The shared field groups, loaded by mu-plugins/patronage-fields-loader.php.
  - ../../wordpress-shared/patronage-fields:/var/www/html/wp-content/mu-plugins/patronage-fields:ro
  - ./wp-content/themes/patronage-timber:/var/www/html/wp-content/themes/patronage-timber

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: wordpress
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 30

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8090}:80"
    environment: *wordpress-env
    volumes: *wordpress-volumes
    # On a fresh volume the entrypoint copies WordPress in before it writes
    # wp-config.php; WP-CLI must not run before then.
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/wp-config.php"]
      interval: 1s
      retries: 60

  # WP-CLI, run as the Apache image's www-data (uid 33) so files it writes stay writable.
  cli:
    image: wordpress:cli-php8.3
    profiles: [cli]
    user: "33:33"
    depends_on:
      wordpress:
        condition: service_healthy
    environment: *wordpress-env
    volumes:
      - wordpress:/var/www/html
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ../../wordpress-shared/patronage-fields:/var/www/html/wp-content/mu-plugins/patronage-fields:ro
      - ./wp-content/themes/patronage-timber:/var/www/html/wp-content/themes/patronage-timber
      # Demo content for bin/seed.sh.
      - ../../wordpress-shared/patronage-fields/seed:/seed:ro
      - ../../packages/demo-content:/demo-content:ro

volumes:
  db: {}
  wordpress: {}
