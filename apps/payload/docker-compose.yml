# Local Postgres for PAYLOAD_DB=postgres and `pnpm db:pull`. Start it with
# `pnpm db`; `pnpm db:recreate` deletes its data and starts it empty.
# The major version matches the PlanetScale database (PG_MAJOR in db-pull.env).
name: launch-payload-db
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: launch_payload
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      interval: 2s
      retries: 30
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "launch_payload"]
    ports:
      # Not 5432, so it can run beside a Postgres installed on the machine.
      - "127.0.0.1:5437:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
volumes:
  postgres: {}
