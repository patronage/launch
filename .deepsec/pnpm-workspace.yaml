# Separate scanner dependencies from the deployable apps.
packages: []
minimumReleaseAge: 180
savePrefix: ""
# Dependencies allowed (true) or refused (false) to run install scripts.
# esbuild's postinstall only verifies its platform binary. @google/genai's
# preinstall is a no-op echo and protobufjs's postinstall only prints a
# version-scheme warning.
allowBuilds:
  "@google/genai": false
  esbuild: false
  protobufjs: false
