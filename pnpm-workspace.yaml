packages:
  - apps/*
  - packages/*
  - wordpress-shared/*

# Only install package versions published at least this many minutes ago.
# 3 hours for now so the spikes can start on vinext 1.4; the goal is 4320 (72 hours).
# taze reads this value too, so it is the single source for the release-age window.
minimumReleaseAge: 180

# Pin exact versions when adding dependencies.
savePrefix: ""

# One version for the dependencies most packages share, so the workspace
# doesn't drift into cohorts. A package.json says "catalog:" to use it.
# @types/node follows the Node major in the root engines field.
catalog:
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  react: 19.3.1
  react-dom: 19.3.1
  vite: 8.3.5
  vitest: 5.0.5

# Dependencies allowed (true) or refused (false) to run install scripts.
# workerd downloads its runtime binary. esbuild's postinstall only verifies its
# platform binary, which installs as an optional dependency anyway. The
# Tailwind CLI's @parcel/watcher ships prebuilt binaries the same way.
# core-js-pure (through the MCP Worker's agents dependency) only prints a banner.
allowBuilds:
  "@parcel/watcher": false
  core-js-pure: false
  esbuild: false
  workerd: true
