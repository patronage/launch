packages:
  - apps/*
  - packages/*

# Only install package versions published at least this many minutes ago.
# 3 hours for now so the spikes can start on vinext 1.4; the goal is 4320 (72 hours).
# taze reads this value too, so it is the single source for the release-age window.
minimumReleaseAge: 180

# Pin exact versions when adding dependencies.
savePrefix: ""
